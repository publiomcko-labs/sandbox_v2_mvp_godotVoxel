name: V3 native integration and isolated SQLite reopen
on:
  push:
    branches: [v3/development]
    paths:
      - 'native/src/v3_world_session.*'
      - 'native/src/register_types.cpp'
      - 'native/SConstruct'
      - 'native/src/core/**'
      - 'native/src/content_registry/**'
      - 'native/src/persistence/**'
      - 'scripts/bootstrap-windows.ps1'
      - 'third_party.lock'
      - 'scripts/v3-session-smoke-windows.ps1'
      - 'godot/tests/v3_session_smoke.gd'
      - 'godot/tests/v3_runtime_smoke.gd'
      - 'godot/scripts/v3_*.gd'
      - 'godot/scenes/v3_main.tscn'
      - 'godot/mods/**'
      - 'examples/v3/**'
      - '.github/workflows/v3-native-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-native-integration
  cancel-in-progress: false
jobs:
  native-headless:
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Require installed VS2022 MSVC x64 before fetching engine
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path -LiteralPath $vswhere)) { throw 'MSVC discovery tool unavailable' }
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs -or !(Test-Path "$vs\VC\Auxiliary\Build\vcvars64.bat")) { throw 'MSVC x64 toolchain unavailable' }
          $cl = @(Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -File)
          if (!$cl.Count) { throw 'MSVC cl.exe unavailable' }
          Write-Host "V3_MSVC_PREFLIGHT_PASS $vs"
      - name: Isolated build tools and SCons cache
        run: |
          $ErrorActionPreference='Stop'
          uv python install 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Python install failed' }
          uv venv .venv --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Python venv failed' }
          uv pip install --python .venv/Scripts/python.exe scons==4.10.0
          if ($LASTEXITCODE -ne 0) { throw 'SCons install failed' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Resolve-Path '.venv/Scripts').Path
          $cache=Join-Path $env:RUNNER_TOOL_CACHE 'sandbox-voxel-a0-scons-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCONS_CACHE=$cache"
      - name: Verify pinned SCons actually detects MSVC before engine download
        run: |
          $ErrorActionPreference='Stop'
          & .venv/Scripts/python.exe -c "from SCons.Script import Environment; from SCons.Tool import msvc; e=Environment(tools=[]); assert msvc.exists(e), 'Pinned SCons cannot discover installed MSVC'; print('V3_SCONS_MSVC_DISCOVERY_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SCons MSVC discovery failed' }
      - name: Parse PowerShell entrypoints before build
        run: |
          foreach ($file in @('scripts/bootstrap-windows.ps1','scripts/v3-session-smoke-windows.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Host; throw "PowerShell parse failed: $file" }
          }
      - name: Restore SCons object cache across attempts
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: v3-vs2022-scons-4.10.0-${{ hashFiles('third_party.lock', 'native/SConstruct') }}-${{ github.sha }}
          restore-keys: |
            v3-vs2022-scons-4.10.0-${{ hashFiles('third_party.lock', 'native/SConstruct') }}-
      - name: Build new native DLL with locked custom Godot (never reuse A5 DLL)
        run: ./scripts/bootstrap-windows.ps1
      - name: Save compiler cache even if native compilation fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: v3-vs2022-scons-4.10.0-${{ hashFiles('third_party.lock', 'native/SConstruct') }}-${{ github.sha }}
      - name: A5 compatibility fixture with new DLL
        run: ./scripts/a5-smoke-windows.ps1
      - name: V3 external mods, ordered VoxelTool edits and SQLite checkpoint/reopen
        run: ./scripts/v3-session-smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-native-integration-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            godot/bin/*.dll
            extension_api.json
            reports/generated/v3-session-*/*.log
            reports/generated/a5-ci/*.json
