name: V3 R3 integrated liquid progression and rendered geometry
on:
  push:
    branches: [exp/v3-hydraulic-hybrid]
    paths:
      - '.github/workflows/v3-hydraulic-gpu.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v3-hydraulic-interactive-gpu
  cancel-in-progress: false
jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful native artifact from exact candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 190); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45996221454")
            test "$(jq -r .head_sha <<< "$result")" = "864d6881eb1230a7b3d70ceaa2a9b053dd776c0a"
            if [ "$(jq -r .status <<< "$result")" = completed ]; then
              test "$(jq -r .conclusion <<< "$result")" = success
              exit 0
            fi
            sleep 5
          done
          exit 1
  interactive-gpu:
    needs: validate-candidate
    runs-on: [self-hosted, interactive-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Check interactive Windows session without stopping other processes
        run: |
          $ErrorActionPreference='Stop'
          if ((Get-Process -Id $PID).SessionId -eq 0) { throw 'Runner is not in an interactive Windows session' }
          if (@(Get-Process -Name 'godot*' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Existing Godot instance detected; refusing to interfere' }
      - uses: actions/checkout@v4
        with:
          path: hybrid-integrated-i6-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v3-native-integration-evidence
          run-id: 45996221454
          github-token: ${{ github.token }}
          path: hybrid-integrated-i6-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run isolated rendered Godot fixture and capture only game viewport
        working-directory: hybrid-integrated-i6-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          git diff --quiet 864d6881eb1230a7b3d70ceaa2a9b053dd776c0a HEAD -- native experiments/v3/hybrid godot/scripts godot/shaders godot/scenes godot/mods third_party.lock
          if ($LASTEXITCODE -ne 0) { throw 'Runtime differs from validated native candidate' }
          if (@(Get-Process -Name 'godot*' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Godot already running' }
          ./scripts/bootstrap-windows.ps1 -RuntimeOnly
          $root=(Get-Location).Path
          $project=Join-Path $root 'godot'
          $editor=Join-Path $root '.tools/godot.exe'
          $capture=Join-Path $root 'reports/generated/hybrid-integrated-i6'
          New-Item -ItemType Directory -Force $capture,(Join-Path $project '.godot') | Out-Null
          [IO.File]::WriteAllText((Join-Path $project '.godot/extension_list.cfg'),("res://sandbox_native.gdextension"+[Environment]::NewLine),(New-Object Text.UTF8Encoding($false)))
          $env:V3_GPU_CAPTURE_ROOT=$capture
          $env:V3_HYBRID_SOLVER='1'
          $env:V3_WORLD_ROOT=Join-Path $capture 'worlds'
          $env:V3_MOD_ROOT=Join-Path $root 'examples/v3/mods'
          $env:V3_WORLD_ID='h7_gpu_fixture'
          $env:V3_WORLD_SEED='20261119'
          $env:V3_GEOLOGY_PROFILE='earth:temperate'
          $env:V3_CAVE_PROFILE='karst:natural'
          $env:V3_CAVE_SPAWN='-4,12,28'
          $stdout=Join-Path $capture 'stdout.log'
          $stderr=Join-Path $capture 'stderr.log'
          $p=Start-Process -FilePath $editor -ArgumentList @('--path',('"'+$project+'"'),'--rendering-method','gl_compatibility','--resolution','1280x720','--position','80,80','--max-fps','30','--script','res://tests/v3_hydraulic_integrated.gd') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null=$p.Handle
          if (!$p.WaitForExit(480000)) { $p.Kill(); $p.WaitForExit(); throw 'Owned Godot fixture timed out' }
          $p.WaitForExit()
          Get-Content $stdout
          Get-Content $stderr
          if ($p.ExitCode -ne 0 -or !(Select-String -LiteralPath $stdout -SimpleMatch 'V3_HYBRID_INTEGRATED_PASS phase=write') -or !(Select-String -LiteralPath $stdout -SimpleMatch 'V3_RUNTIME_CLEAN_CLOSE_PASS')) { throw 'Graphical fixture failed' }
          if (!(Select-String -LiteralPath $stdout -SimpleMatch 'V3_HYBRID_PROGRESSIVE_PASS')) { throw 'Progressive front fixture missing' }
          if (Select-String -LiteralPath @($stdout,$stderr) -Pattern 'SHADER ERROR:|SCRIPT ERROR:|V3_HYDRAULIC_RUNTIME_FAIL:|V3_HYBRID_INTEGRATED_FAIL:') { throw 'Graphical errors detected' }
          if (@(Get-ChildItem -LiteralPath $capture -Filter '*.png' -File).Count -ne 7) { throw 'Expected seven integrated game viewport captures' }
          Write-Host 'V3_GPU_CAPTURE_ARTIFACT_READY'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-hybrid-integrated-i6-b2-viewport
          retention-days: 14
          if-no-files-found: warn
          path: |
            hybrid-integrated-i6-${{ github.run_id }}-${{ github.run_attempt }}/reports/generated/hybrid-integrated-i6/*.png
            hybrid-integrated-i6-${{ github.run_id }}-${{ github.run_attempt }}/reports/generated/hybrid-integrated-i6/*.log
