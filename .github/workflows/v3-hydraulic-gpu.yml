name: V3 H13 repeated shoreline qualification
on:
  push:
    branches: [v3/hydraulic]
    paths:
      - '.github/workflows/v3-hydraulic-gpu.yml'
      - 'godot/tests/v3_hydraulic_gpu_capture.gd'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v3-hydraulic-interactive-gpu
  cancel-in-progress: false
jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful native artifact from exact candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 55); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45977720014")
            test "$(jq -r .head_sha <<< "$result")" = "5f99bb606b9965c4cd985fc226f6bc180a354443"
            if [ "$(jq -r .status <<< "$result")" = completed ]; then
              test "$(jq -r .conclusion <<< "$result")" = success
              exit 0
            fi
            sleep 5
          done
          exit 1
  interactive-gpu:
    needs: validate-candidate
    runs-on: [self-hosted, interactive-gpu]
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Check interactive Windows session without stopping other processes
        run: |
          $ErrorActionPreference='Stop'
          if ((Get-Process -Id $PID).SessionId -eq 0) { throw 'Runner is not in an interactive Windows session' }
          if (@(Get-Process -Name 'godot*' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Existing Godot instance detected; refusing to interfere' }
      - uses: actions/checkout@v4
        with:
          path: h13-stress-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v3-native-integration-evidence
          run-id: 45977720014
          github-token: ${{ github.token }}
          path: h13-stress-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run isolated rendered Godot fixture and capture only game viewport
        working-directory: h13-stress-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          git diff --quiet 5f99bb606b9965c4cd985fc226f6bc180a354443 HEAD -- native godot/scripts godot/shaders godot/scenes godot/mods third_party.lock
          if ($LASTEXITCODE -ne 0) { throw 'Runtime differs from validated native candidate' }
          if (@(Get-Process -Name 'godot*' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Godot already running' }
          ./scripts/bootstrap-windows.ps1 -RuntimeOnly
          $root=(Get-Location).Path
          $project=Join-Path $root 'godot'
          $editor=Join-Path $root '.tools/godot.exe'
          $capture=Join-Path $root 'reports/generated/h13-stress'
          New-Item -ItemType Directory -Force $capture,(Join-Path $project '.godot') | Out-Null
          [IO.File]::WriteAllText((Join-Path $project '.godot/extension_list.cfg'),("res://sandbox_native.gdextension"+[Environment]::NewLine),(New-Object Text.UTF8Encoding($false)))
          $env:V3_GPU_CAPTURE_ROOT=$capture
          $env:V3_WORLD_ROOT=Join-Path $capture 'worlds'
          $env:V3_MOD_ROOT=Join-Path $root 'examples/v3/mods'
          $env:V3_WORLD_ID='h7_gpu_fixture'
          $env:V3_WORLD_SEED='20261119'
          $env:V3_GEOLOGY_PROFILE='earth:temperate'
          $env:V3_CAVE_PROFILE='karst:natural'
          $env:V3_CAVE_SPAWN='-4,12,28'
          $stdout=Join-Path $capture 'stdout.log'
          $stderr=Join-Path $capture 'stderr.log'
          $p=Start-Process -FilePath $editor -ArgumentList @('--path',('"'+$project+'"'),'--rendering-method','gl_compatibility','--resolution','1280x720','--position','80,80','--max-fps','30','--script','res://tests/v3_hydraulic_gpu_capture.gd') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null=$p.Handle
          if (!$p.WaitForExit(240000)) { $p.Kill(); $p.WaitForExit(); throw 'Owned Godot fixture timed out' }
          $p.WaitForExit()
          Get-Content $stdout
          Get-Content $stderr
          if ($p.ExitCode -ne 0 -or !(Select-String -LiteralPath $stdout -SimpleMatch 'V3_GPU_VISUAL_FIXTURE_PASS') -or !(Select-String -LiteralPath $stdout -SimpleMatch 'V3_RUNTIME_CLEAN_CLOSE_PASS')) { throw 'Graphical fixture failed' }
          if (!(Select-String -LiteralPath $stdout -SimpleMatch 'V3_GPU_STRESS_PASS')) { throw 'Repeated shore edit fixture missing' }
          if (Select-String -LiteralPath @($stdout,$stderr) -Pattern 'SHADER ERROR:|SCRIPT ERROR:|V3_HYDRAULIC_RUNTIME_FAIL:') { throw 'Graphical errors detected' }
          if (@(Get-ChildItem -LiteralPath $capture -Filter '*.png' -File).Count -ne 14) { throw 'Expected fourteen game viewport captures' }
          Write-Host 'V3_GPU_CAPTURE_ARTIFACT_READY'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-h13-stress-viewport
          retention-days: 14
          if-no-files-found: warn
          path: |
            h13-stress-${{ github.run_id }}-${{ github.run_attempt }}/reports/generated/h13-stress/*.png
            h13-stress-${{ github.run_id }}-${{ github.run_attempt }}/reports/generated/h13-stress/*.log
